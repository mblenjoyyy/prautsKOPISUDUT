# Nginx site config untuk Kopi Sudut
#
# Cara pakai di server Ubuntu:
#   sudo cp /var/www/html/deploy/nginx-kopi-sudut.conf /etc/nginx/sites-available/kopi-sudut
#   sudo ln -s /etc/nginx/sites-available/kopi-sudut /etc/nginx/sites-enabled/kopi-sudut
#   sudo nginx -t && sudo systemctl reload nginx
#
# Catatan: limit_req_zone didefinisikan di file
#   deploy/nginx-ratelimit.conf -> /etc/nginx/conf.d/ratelimit.conf
# (harus berada di context http).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html;
    index index.html;

    # ---------------------------------------------------------
    # Jangan pernah melayani file sensitif / source code
    # ---------------------------------------------------------
    location ^~ /backend/ {
        return 403;
    }

    location ^~ /deploy/ {
        return 403;
    }

    location ~ /\.git {
        return 403;
    }

    # Semua dotfile ditolak, kecuali /.well-known/ (ACME challenge)
    location ~ /\.(?!well-known/) {
        return 403;
    }

    # ---------------------------------------------------------
    # Reverse proxy API ke Node.js (127.0.0.1:3000)
    # ---------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limit khusus endpoint POST pesanan
    # (zone "pesanan_limit" didefinisikan di nginx-ratelimit.conf)
    location = /api/pesanan {
        limit_req zone=pesanan_limit burst=5 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check (dipakai monitoring / demo)
    location = /health {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------
    # File statis (website)
    # ---------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}