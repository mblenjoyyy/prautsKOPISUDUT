# Rate limit zone untuk Kopi Sudut.
#
# PENTING: direktif ini HARUS berada di context "http",
# jadi letakkan file ini di:
#   /etc/nginx/conf.d/ratelimit.conf
#
# Contoh pemasangan:
#   sudo cp /var/www/html/deploy/nginx-ratelimit.conf /etc/nginx/conf.d/ratelimit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Zone ini dipakai oleh "limit_req zone=pesanan_limit ..." di
# deploy/nginx-kopi-sudut.conf pada location = /api/pesanan.

limit_req_zone $binary_remote_addr zone=pesanan_limit:10m rate=5r/m;